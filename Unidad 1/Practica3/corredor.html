<body>
    <main>
        <section id="principal">
            <h1>Corredor</h1>
            <form name="corredor" method="post" action="#" enctype="multipart/form-data">
                <section id="datosCorredor">
                    <div id="nombreCompleto">
                        <div id="nombreC">
                            <label>Nombre: </label>
                            <input type="text" name="nombreP" id="nombreP" />
                        </div>
                        <div id="apellidoP">
                            <label>Apellido: </label>
                            <input type="text" name="apellidoP" id="apellidoP" />
                        </div>
                        <div id="apellidoM">
                            <label>Apellido Materno: </label>
                            <input type="text" name="apellidoM" id="apellidoM" />
                        </div>
                    </div>
                    <div id="datosExtraC">
                        <div id="edad">
                            <label>Edad: </label>
                            <select name="edadP" id="edadP">
                                <option value="Vacio"></option>
                                <option value="1">18</option>
                                <option value="2">19</option>
                                <option value="3">20</option>
                            </select>
                        </div>
                        <div id="genero">
                            <label>Genero: </label>
                            <input type="radio" name="generoP" id="generoP" value="hombre" />Hombre
                            <input type="radio" name="generoP" id="generoP2" value="mujer" />Mujer
                        </div>
                    </div>
                    <div id="foto">
                        <label>Foto: </label>
                        <input type="file" id="fotoC" />
                    </div>
                </section>
            </form>
        
            <button id="btnGuardar" onclick="mostrarCorredor()">Guardar</button>
